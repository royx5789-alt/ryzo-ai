<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RYZO AI Suite</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0b0f;
            color: #ffffff;
            padding: 15px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .card {
            background: #14141d;
            border: 2px solid #ff007f;
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
        }
        .header-title {
            color: #ff3399;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .header-subtitle {
            color: #00ffff;
            font-size: 12px;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .banner-video-container {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #ff007f;
            background: #000;
            margin-bottom: 12px;
        }
        .banner-video-container video {
            width: 100%;
            height: auto;
            display: block;
        }
        /* Style Pemutar Musik Payphone */
        .music-player {
            background: #1a1a26;
            border: 1px solid #00ffff;
            border-radius: 10px;
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .music-info {
            font-size: 12px;
            color: #00ffcc;
            font-weight: bold;
        }
        .music-player audio {
            width: 60%;
            height: 32px;
        }
        .section-title {
            color: #bf00ff;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .feature-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        .feature-btn {
            background: #1a1a26;
            border: 1px solid #bf00ff;
            border-radius: 10px;
            color: #fff;
            padding: 10px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
        }
        .feature-btn:hover, .feature-btn:active {
            background: #2a2a3e;
            border-color: #00ffff;
            box-shadow: 0 0 8px rgba(0, 255, 255, 0.4);
        }
        textarea, input[type="text"] {
            width: 100%;
            background: #1a1a26;
            border: 1px solid #bf00ff;
            border-radius: 10px;
            color: #fff;
            padding: 12px;
            font-size: 14px;
            margin-bottom: 12px;
            resize: none;
        }
        textarea:focus, input:focus {
            outline: none;
            border-color: #00ffff;
            box-shadow: 0 0 8px rgba(0, 255, 255, 0.5);
        }
        .btn {
            width: 100%;
            background: linear-gradient(45deg, #ff007f, #bf00ff);
            border: none;
            border-radius: 10px;
            color: white;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn:active {
            opacity: 0.8;
        }
        .output-box {
            background: #12121a;
            border: 1px solid #bf00ff;
            border-radius: 12px;
            padding: 12px;
            margin-top: 15px;
            max-height: 250px;
            overflow-y: auto;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            color: #00ffcc;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .chat-container {
            background: #12121a;
            border: 1px solid #bf00ff;
            border-radius: 12px;
            padding: 10px;
            height: 300px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 12px;
        }
        .chat-bubble {
            padding: 10px 14px;
            border-radius: 10px;
            max-width: 80%;
            font-size: 13px;
            line-height: 1.4;
        }
        .chat-user {
            background: #ff007f;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .chat-ai {
            background: #1a1a26;
            border: 1px solid #00ffff;
            color: #00ffcc;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <div class="header-title">RYZO AI Suite</div>
            <div class="header-subtitle">⚡ CYBERPUNK INTELLIGENCE CORE ⚡</div>
            
            <div class="banner-video-container">
                <video autoplay muted loop playsinline>
                    <source src="1000095574.mp4" type="video/mp4">
                    Browser Anda tidak mendukung tag video.
                </video>
            </div>

            <div class="music-player">
                <div class="music-info">🎵 Maroon 5 - Payphone</div>
                <audio controls loop>
                    <source src="https://cdns.savht.com/s/d/Maroon_5_-_Payphone_ft._Wiz_Khalifa_(Official_Music_Video)(128k).mp3" type="audio/mp3">
                    Browser Anda tidak mendukung audio.
                </audio>
            </div>
        </div>

        <div class="card">
            <div class="section-title">MODUL FITUR UTAMA</div>
            <div class="feature-grid">
                <button class="feature-btn" onclick="switchMode('tools')">💬 16. AI Chat Room</button>
                <button class="feature-btn" onclick="selectFeature('Code Generator HTML/CSS')">💻 1. Code Builder</button>
                <button class="feature-btn" onclick="selectFeature('Smart Text Summarizer')">📝 2. Text Summary</button>
                <button class="feature-btn" onclick="selectFeature('Cyber Security Audit Assistant')">🛡️ 3. Security Audit</button>
                <button class="feature-btn" onclick="selectFeature('AI Bug Finder & Debugger')">🐛 4. Bug Debugger</button>
                <button class="feature-btn" onclick="selectFeature('Regex Pattern Generator')">🔍 5. Regex Generator</button>
                <button class="feature-btn" onclick="selectFeature('SQL Query Builder')">🗄️ 6. SQL Query Builder</button>
                <button class="feature-btn" onclick="selectFeature('API Endpoint Tester Simulation')">🌐 7. API Tester</button>
                <button class="feature-btn" onclick="selectFeature('JSON Data Formatter & Validator')">📋 8. JSON Formatter</button>
                <button class="feature-btn" onclick="selectFeature('Creative Prompt Engineering Assistant')">💡 9. Prompt Engineer</button>
                <button class="feature-btn" onclick="selectFeature('Multi-Language Code Translator')">🔄 10. Code Translator</button>
                <button class="feature-btn" onclick="selectFeature('Cyberpunk Nickname & Bio Generator')">✨ 11. Cyber Nickname</button>
                <button class="feature-btn" onclick="selectFeature('Algorithmic Logic Solver')">🧮 12. Logic Solver</button>
                <button class="feature-btn" onclick="selectFeature('Markdown to HTML Converter')">📄 13. Markdown Converter</button>
                <button class="feature-btn" onclick="selectFeature('Base64 & Hash Encoder/Decoder')">🔐 14. Hash Encoder</button>
                <button class="feature-btn" onclick="selectFeature('System Architecture Planner')">📊 15. Arch Planner</button>
            </div>
        </div>

        <div class="card" id="toolsWorkspace">
            <div class="section-title" id="workspaceTitle">WORKSPACE: Code Builder</div>
            <textarea id="promptInput" rows="3" placeholder="Masukkan perintah atau detail tugas di sini..."></textarea>
            <button class="btn" onclick="processAIRequest()">Jalankan Proses AI</button>
            
            <div style="margin-top: 15px; font-weight: bold; color: #aaa;">Hasil Eksekusi:</div>
            <div id="outputResult" class="output-box">Pilih modul fitur di atas atau ketik perintah manual...</div>
        </div>

        <div class="card" id="chatWorkspace" style="display: none;">
            <div class="section-title">AI CHAT ROOM (Ngobrol Interaktif)</div>
            <div class="chat-container" id="chatBox">
                <div class="chat-bubble chat-ai">Halo! Saya RYZO AI. Ada yang ingin kamu diskusikan atau tanyakan hari ini?</div>
            </div>
            <input type="text" id="chatInput" placeholder="Ketik pesan atau pertanyaan ke AI..." onkeydown="if(event.key === 'Enter') sendChatMessage()">
            <button class="btn" onclick="sendChatMessage()">Kirim Pesan</button>
        </div>
    </div>

    <script>
        let activeFeature = "Code Generator HTML/CSS";

        function selectFeature(featureName) {
            document.getElementById('toolsWorkspace').style.display = "block";
            document.getElementById('chatWorkspace').style.display = "none";
            activeFeature = featureName;
            document.getElementById('workspaceTitle').innerText = "WORKSPACE: " + featureName;
            document.getElementById('promptInput').placeholder = "Masukkan detail untuk " + featureName + "...";
            window.scrollTo({ top: document.getElementById('toolsWorkspace').offsetTop - 10, behavior: 'smooth' });
        }

        function switchMode(mode) {
            if(mode === 'tools') {
                document.getElementById('toolsWorkspace').style.display = "none";
                document.getElementById('chatWorkspace').style.display = "block";
                window.scrollTo({ top: document.getElementById('chatWorkspace').offsetTop - 10, behavior: 'smooth' });
            }
        }

        async function processAIRequest() {
            const prompt = document.getElementById('promptInput').value.trim();
            const outputBox = document.getElementById('outputResult');

            if (!prompt) {
                outputBox.innerText = "⚠️ Masukkan teks atau perintah terlebih dahulu!";
                return;
            }

            outputBox.innerText = "⏳ Sedang memproses modul [" + activeFeature + "]... Harap tunggu...";

            try {
                const response = await fetch(`https://text.pollinations.ai/${encodeURIComponent("Bertindaklah sebagai AI profesional untuk fitur [" + activeFeature + "]. Permintaan user: " + prompt)}`);
                
                if (!response.ok) {
                    throw new Error(`Gagal terhubung ke server (Error ${response.status})`);
                }

                const resultText = await response.text();
                outputBox.innerText = resultText;

            } catch (error) {
                outputBox.innerText = "❌ Terjadi kesalahan: " + error.message + "\nSilakan coba lagi beberapa saat.";
            }
        }

        async function sendChatMessage() {
            const inputField = document.getElementById('chatInput');
            const chatBox = document.getElementById('chatBox');
            const userText = inputField.value.trim();

            if (!userText) return;

            chatBox.innerHTML += `<div class="chat-bubble chat-user">${escapeHtml(userText)}</div>`;
            inputField.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            const loadingId = "loading_" + Date.now();
            chatBox.innerHTML += `<div class="chat-bubble chat-ai" id="${loadingId}">Sedang mengetik...</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch(`https://text.pollinations.ai/${encodeURIComponent("Jawablah sebagai asisten AI yang ramah, interaktif, dan membantu dalam bahasa Indonesia. Pertanyaan: " + userText)}`);
                
                if (!response.ok) {
                    throw new Error("Gagal merespons");
                }

                const replyText = await response.text();
                document.getElementById(loadingId).innerText = replyText;

            } catch (error) {
                document.getElementById(loadingId).innerText = "❌ Maaf, koneksi terputus. Coba lagi.";
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
  </html>
